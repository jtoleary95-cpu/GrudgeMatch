<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grudge Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --cobalt:#2B3BD6; --cobalt-deep:#1E2AA8; --paper:#FFF7E6; --ink:#161A4A;
  --sun:#FFC93C; --pink:#FF5C9E; --good:#36C98A; --bad:#E5412F;
  --display:"Bowlby One","Arial Black",Impact,sans-serif;
  --body:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --cobalt:#1C2690; --cobalt-deep:#121a66; } }
:root[data-theme="dark"]{ --cobalt:#1C2690; --cobalt-deep:#121a66; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--cobalt);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#app{max-width:480px;margin:0 auto;padding:14px 14px 28px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.02}
.logo{font-family:var(--display);color:var(--sun);font-size:clamp(46px,15vw,72px);line-height:.9;text-shadow:4px 4px 0 var(--ink);
  transform:rotate(-3deg);margin:18px 0 6px}
.logo span{display:block;color:var(--pink)}
.tag{color:var(--paper);opacity:.85;margin:0 0 18px}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:18px;margin:0 0 16px}
.card h2{font-size:28px;margin-bottom:8px}
.card p{margin:6px 0}
label{display:block;font-weight:800;margin:10px 0 4px}
input{width:100%;font:inherit;font-size:20px;padding:12px 14px;border:3px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
input:focus-visible,button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.btn{display:block;width:100%;font-family:var(--display);font-size:22px;padding:14px 16px;margin:12px 0 0;border:3px solid var(--ink);border-radius:14px;
  background:var(--sun);color:var(--ink);box-shadow:4px 4px 0 var(--ink);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.alt{background:var(--pink)}
.btn.ghost{background:transparent;box-shadow:none;font-family:var(--body);font-weight:800;font-size:17px}
.btn:disabled{opacity:.45;pointer-events:none}
.seg{display:flex;gap:8px}
.seg button{flex:1;font:800 18px var(--body);padding:10px;border:3px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.topbar{display:flex;justify-content:flex-end;position:relative;z-index:5;margin-top:6px}
.gear{width:48px;height:48px;font-size:26px;border:3px solid var(--ink);border-radius:14px;background:var(--paper);box-shadow:3px 3px 0 var(--ink);cursor:pointer;color:var(--ink)}
.cv{display:block;width:100%;border:3px solid var(--ink);border-radius:18px;background:#9ED8F5;touch-action:none}
.hud{display:flex;justify-content:space-between;color:var(--paper);font-weight:800;margin:0 2px 8px}
.shells{position:relative;height:190px;background:linear-gradient(#F4D58D,#E8BF6A);border:3px solid var(--ink);border-radius:18px;overflow:hidden;touch-action:none}
.shell{position:absolute;bottom:34px;width:30%;height:110px;transition:left .25s ease,transform .15s;touch-action:none}
.shell.drag{transition:none;transform:translateY(-14px) scale(1.06);z-index:2}
.shell svg{width:100%;height:100%}
.ball{position:absolute;bottom:22px;width:34px;height:34px;border-radius:50%;background:var(--bad);border:3px solid var(--ink);transition:left .25s ease}
.rps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rps button{font-size:52px;aspect-ratio:1;border:3px solid var(--ink);border-radius:18px;background:var(--paper);box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.rps button[aria-pressed="true"]{background:var(--sun);transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.bb{position:relative;height:min(76vh,680px);border:3px solid var(--ink);border-radius:18px;overflow:hidden;touch-action:none;background:#05060f}
.bb canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.bb-hud{position:absolute;top:8px;left:8px;right:8px;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;color:#fff;font-weight:800;font-size:13px;pointer-events:none}
.bb-side.r{text-align:right}
.bb-bar{height:12px;border:2px solid #fff;border-radius:7px;overflow:hidden;background:rgba(0,0,0,.4);margin-top:3px}
.bb-bar i{display:block;height:100%;width:0;background:var(--bad);transition:width .15s}
.bb-side.r .bb-bar i{margin-left:auto}
.bb-mid{text-align:center;font-size:11px;opacity:.9}
.bb-time{font-family:var(--display);font-size:28px;line-height:1}
.bb-big{position:absolute;left:0;right:0;top:38%;text-align:center;font-family:var(--display);font-size:clamp(34px,11vw,60px);color:var(--sun);text-shadow:4px 4px 0 var(--ink);pointer-events:none;transition:opacity .2s;padding:0 10px}
.bb-sta{position:absolute;left:120px;right:120px;bottom:22px;color:#fff;font-weight:800;font-size:12px;pointer-events:none}
.bb-sta .bb-bar i{background:var(--good)}
.bb-gl{position:absolute;bottom:12px;width:96px;height:96px;border-radius:50%;border:3px solid rgba(255,255,255,.75);background:rgba(22,26,74,.5);display:flex;align-items:center;justify-content:center;pointer-events:none;transition:transform .08s,background .08s}
.bb-gl.l{left:12px}.bb-gl.r{right:12px}.bb-gl.on{background:rgba(255,201,60,.9);transform:scale(.9)}
.bb-gl svg{width:60px;height:60px}.bb-gl.r svg{transform:scaleX(-1)}
.bb-blkl{position:absolute;left:0;right:0;bottom:62px;text-align:center;color:rgba(255,255,255,.7);font:800 12px var(--body);pointer-events:none}
.bb-rep{position:absolute;top:64px;left:12px;background:var(--bad);color:#fff;font:800 13px var(--body);padding:3px 10px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none}
.bb-nm{width:100%;margin:6px 0 12px}
.err{color:var(--bad);font-weight:800;min-height:1.4em;margin-top:8px}
.banner{background:var(--sun);border:3px solid var(--ink);border-radius:12px;padding:8px 12px;font-size:14px;margin-bottom:14px}
.code{font-family:var(--display);font-size:64px;letter-spacing:.08em;text-align:center;margin:8px 0}
.muted{opacity:.7}
.center{text-align:center}

/* scoreboard */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;color:var(--paper);margin:4px 0 14px}
.score .pl{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score .pl.r{text-align:right}
.score .nums{font-family:var(--display);font-size:30px;display:flex;gap:10px;align-items:center}
.score .nums b{font-weight:400;min-width:1.2ch;text-align:center}
.score .vs{font-family:var(--body);font-weight:800;font-size:13px;opacity:.8}
.c1{color:var(--sun)} .c2{color:var(--pink)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);vertical-align:-1px;margin-right:6px}
.dot.p1{background:var(--sun)} .dot.p2{background:var(--pink)}

.status{font-family:var(--display);font-size:24px;color:var(--paper);text-align:center;margin:6px 0 12px;text-shadow:3px 3px 0 var(--ink)}
.status.mine{color:var(--sun)}

/* grids */
.grid{display:grid;gap:6px;margin:0 auto}
.cell{aspect-ratio:1;border:3px solid var(--ink);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);color:var(--ink);cursor:pointer;padding:0;touch-action:manipulation;position:relative}
.cell:disabled{cursor:default}
.cell.sm{border-width:2px;border-radius:6px}
.mini-wrap{margin-top:16px}
.mini-wrap h3{font-size:16px;color:var(--paper);margin-bottom:6px;font-family:var(--body);font-weight:800}
.mini{max-width:200px;margin:0}
.legend{display:flex;align-items:center;gap:6px;color:var(--paper);font-size:14px;font-weight:800;margin:12px 0 0}
.legend .bar{flex:1;height:14px;border:2px solid var(--ink);border-radius:8px;
  background:linear-gradient(90deg,#FFF3B0,#FFE066,#F9C22E,#F28C28,#E5512A,#C0141E)}

/* ttt */
.ttt{grid-template-columns:repeat(3,1fr);max-width:340px;gap:10px}
.ttt .cell{font-size:64px;border-radius:16px}
.mark-p1{color:var(--ink);background:var(--sun)!important}
.mark-p2{color:var(--ink);background:var(--pink)!important}

/* race */
.lane{position:relative;height:74px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;margin:0 0 12px;overflow:hidden}
.lane .finish{position:absolute;right:0;top:0;bottom:0;width:18px;
  background:repeating-conic-gradient(var(--ink) 0 25%,#fff 0 50%) 0 0/12px 12px;border-left:3px solid var(--ink)}
.lane .cube{position:absolute;top:13px;left:8px;width:42px;height:42px;border:3px solid var(--ink);border-radius:8px;transition:left .08s linear}
.lane .who{position:absolute;left:60px;top:22px;font-weight:800;opacity:.5;font-size:15px}
.pad{height:42vh;min-height:220px;border:3px solid var(--ink);border-radius:22px;background:var(--sun);box-shadow:5px 5px 0 var(--ink);
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:44px;touch-action:none}
.pad.off{background:var(--paper);opacity:.7}
.pad.hit{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--ink)}
.big-count{font-family:var(--display);font-size:120px;color:var(--sun);text-align:center;text-shadow:5px 5px 0 var(--ink);line-height:1}

/* pig */
.die{width:132px;height:132px;margin:8px auto 14px;background:#fff;border:4px solid var(--ink);border-radius:24px;box-shadow:5px 5px 0 var(--ink);
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:16px}
.die i{width:24px;height:24px;border-radius:50%;background:var(--ink);place-self:center;visibility:hidden}
.die i.on{visibility:visible}
.die.bust{background:var(--bad)} .die.bust i{background:#fff}
.die.roll{animation:shake .35s}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}50%{transform:rotate(10deg)}75%{transform:rotate(-6deg)}}
.pigrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin:8px 0;font-weight:800}
.meter{height:16px;border:3px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden}
.meter i{display:block;height:100%}
.pot{font-family:var(--display);font-size:26px;text-align:center;margin:4px 0}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}

/* clock */
.clock{font-family:var(--display);font-size:92px;text-align:center;color:var(--paper);text-shadow:5px 5px 0 var(--ink);margin:30px 0 24px;font-variant-numeric:tabular-nums}
.stop{height:200px;border-radius:50%;width:200px;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:40px;background:var(--bad);color:#fff}

/* draw */
.draw-screen{min-height:62vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:22px;border:3px solid var(--ink);padding:20px;background:var(--paper)}
.draw-screen.dark{background:#000;color:#555}
.draw-screen.bang{background:var(--sun)}
.draw-screen.foul{background:var(--bad);color:#fff}
.draw-screen h2{font-size:54px}
.shots{display:flex;gap:8px;justify-content:center;margin:10px 0}

/* hint labels */
.hint{font-family:var(--body);font-weight:800;font-size:11px;position:absolute;bottom:2px;left:0;right:0;text-align:center}
.h-hot{background:#E5512A!important;color:#fff}.h-warm{background:#F9C22E!important}.h-cold{background:#9DB7FF!important}
.picked{background:var(--ink)!important;color:var(--paper)}

/* result */
.slam{font-family:var(--display);font-size:clamp(34px,10vw,48px);color:var(--sun);text-shadow:4px 4px 0 var(--ink);margin:20px 0 8px;line-height:1.05;
  animation:slam .45s cubic-bezier(.2,1.6,.4,1) both}
.slam.lose{color:var(--pink)}
.verdict{color:var(--paper);font-weight:800;font-size:20px;margin:0 0 4px}
.detail{color:var(--paper);opacity:.85;margin:0 0 16px}
@keyframes slam{from{transform:scale(1.8) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{font:800 17px var(--body);text-align:left;padding:12px;border:3px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);
  box-shadow:3px 3px 0 var(--ink);cursor:pointer;min-height:84px}
.pick small{display:block;font-weight:400;font-size:13px;opacity:.75;margin-top:4px}
.pick:disabled{opacity:.35;box-shadow:none;text-decoration:line-through}
.pick:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* ===== FIREBASE CONFIG (same project as Deep Salvo and Sovereign) ===== */
const FIREBASE_CONFIG = {

const COLL = "mgames";
const BAD=["CUM","DIC","COC","PUS","KOC","WHR","FAP","JAP","SPIC","SPC","CHNK","GOOK","GK","HOMO","HMO","TRAN","LES","LEZ","QUER","DYKE","KUM","JIZ","JZZ","SEX","SXY","SX","XXX","FUK","FUC","FUQ","FUX","FCK","FK","FKU","PHUK","CUNT","CNT","KUNT","COCK","COK","KOK","CCK","DIK","DICK","DCK","DIX","DYK","PUSS","PUSY","PSY","PSSY","TIT","TT","TWAT","TWT","VAG","VAJ","VJ","BJ","HJ","ANAL","ANL","ANUS","ASS","AZZ","BUTT","BUT","BUM","BUTTH","BOOB","BOB","NUT","NUTS","PORN","PRN","PORNO","HORNY","HRNY","HUMP","SLUT","SLT","WHORE","WHOR","HOE","HO","THOT","SUCK","SUK","SUCC","LICK","LCK","BLOW","BJOB","CLIT","CLT","PENIS","PENI","PNS","PEN","WANK","WNK","JERK","JRK","NUDE","NUD","FAG","FAGG","FGT","GAY","NIG","NIGG","NGR","NGGR","NGA","KKK","KK","NAZI","NAZ","NZ","HITLR","SHIT","SHT","SHT","CRAP","CRP","PISS","PIS","PSS","PEE","POO","POOP","TURD","DAMN","DMN","DAM","HELL","HEL","BTCH","BICH","BCH","BITCH","DUMB","STFU","WTF","FML","FU","KYS","DIE","KILL","RAPE","RAP","RAPY","MOLEST","PEDO","PED","CHILD","DRUG","METH","LSD","WEED","HMP","MILF","MLF","GILF","DILF","BDSM","BDS","KINK","NSFW","HENT","HNTY","XXL","SEXY","SEXI"];
function isClean(s){ const u = String(s).toUpperCase().replace(/[^A-Z]/g, ""); return !BAD.some(b => u.includes(b)); }

/* ---------------- messages ---------------- */
const WIN_MSGS = [
  "Okay, so you won. Do you want a cookie?",
  "Wow, you're so amazing 🙄",
  "Congrats. I'll alert the media.",
  "You could be an Olympic medalist, I'm not kidding",
  "Your trophy is in the mail.",
  "Fine. You win. Happy now?",
  "Even a broken clock is right twice a day.",
  "Winner winner, no dinner.",

const LOSE_MSGS = [
  "You tried your best, so we should have anticipated this outcome",
  "You lose! Surprised?",
  "You have brought great shame upon your family",
  "Have you considered a different hobby?",
  "Losing builds character. You must have so much character.",

const MATCH_WIN_MSGS = [
  "The crowd goes mild.",
  "Champion of absolutely nothing. Congrats.",
  "You beat a friend at phone games. Put it on your resume.",

const MATCH_LOSE_MSGS = [

  "Thank you for your participation. It has been noted.",
  "History won't remember this. You will.",
  "Your rematch request is pending. So is your dignity.",
  "You lost to them? Them?"
];
const msgIdx = {}, msgCache = {};
function msgFor(key, list){
  if(!(key in msgCache)){ const name = list === WIN_MSGS ? "w" : list === LOSE_MSGS ? "l" : list === MATCH_WIN_MSGS ? "mw" : "ml"; msgIdx[name] = msgIdx[name] || 0; msgCache[key] = list[msgIdx[name]++ % list.length]; }
  return msgCache[key];
}

/* ---------------- helpers ---------------- */
const app = document.getElementById("app");
const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const opp = (p) => p === "p1" ? "p2" : "p1";
const arr = (x) => Array.isArray(x) ? x : (x && typeof x === "object" ? Object.values(x) : []);
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const rnd = (n) => Math.floor(Math.random() * n);
const clone = (o) => JSON.parse(JSON.stringify(o));
const cheb = (a, b, n) => Math.max(Math.abs(a % n - b % n), Math.abs(Math.floor(a / n) - Math.floor(b / n)));
function prune(o){
  if(Array.isArray(o)){ const a = o.map(prune).filter(v => v !== undefined && v !== null); return a.length ? a : undefined; }
  if(o && typeof o === "object"){ const r = {}; for(const k in o){ const v = prune(o[k]); if(v !== undefined && v !== null) r[k] = v; } return Object.keys(r).length ? r : undefined; }
  return o;
}
function setPath(obj, path, val){
  const parts = path.split("/"); let o = obj;
  for(let i = 0; i < parts.length - 1; i++){ if(typeof o[parts[i]] !== "object" || o[parts[i]] === null) o[parts[i]] = {}; o = o[parts[i]]; }
  if(val === null || val === undefined) delete o[parts.at(-1)]; else o[parts.at(-1)] = val;
}

/* ---------------- backend ---------------- */
const onlineApi = LOCAL ? (() => {
  const ch = ("BroadcastChannel" in window) ? new BroadcastChannel("grudge") : null;
  const subs = {};
  const key = c => "grudge_" + c;
  const read = c => { try { return JSON.parse(localStorage.getItem(key(c))); } catch { return null; } };
  const write = (c, v) => { v = prune(v) ?? null; localStorage.setItem(key(c), JSON.stringify(v)); ch && ch.postMessage(c); fire(c); };
  const fire = c => setTimeout(() => (subs[c] || []).forEach(f => f(read(c))), 0);
  ch && (ch.onmessage = e => fire(e.data));
  return {
    listen(c, cb){ (subs[c] ||= []).push(cb); fire(c); return () => subs[c] = subs[c].filter(f => f !== cb); },
    async get(c){ return read(c); },
    async update(c, patch){ const v = read(c) || {}; for(const p in patch) setPath(v, p, patch[p]); write(c, v); },
    async tx(c, mut){ const cur = read(c); if(!cur) return false; const v = clone(cur); if(mut(v) === false) return false; write(c, v); return true; },
    now(){ return Date.now(); },
    async syncClock(){}
  };
})() : (() => {
  let F, fs, offset = 0;
  const ready = (async () => {
    const V = "https://www.gstatic.com/firebasejs/10.12.2/";
    const [A, U, D] = await Promise.all([import(V + "firebase-app.js"), import(V + "firebase-auth.js"), import(V + "firebase-firestore.js")]);
    const fa = A.initializeApp(FIREBASE_CONFIG), auth = U.getAuth(fa);
    await U.signInAnonymously(auth);
    F = D; fs = D.getFirestore(fa);
  })();
  const ref = c => F.doc(fs, COLL, c);
  return {
    ready,
    listen(c, cb){ let off = () => {}, dead = false;
      ready.then(() => { if(dead) return; off = F.onSnapshot(ref(c), s => { if(!s.exists() && s.metadata.fromCache) return; cb(s.exists() ? s.data() : null); }, () => {}); });
      return () => { dead = true; off(); }; },
    async get(c){ await ready; const s = await F.getDoc(ref(c)); return s.exists() ? s.data() : null; },
    async update(c, patch){ await ready; const p = {}; for(const k in patch) p[k.replace(/\//g, ".")] = patch[k];
      try{ return await F.updateDoc(ref(c), p); }

GAMES.rps = {
  title: "Rock Paper Scissors", short: "Best of 3 throws",
  blurb: "Pick before the 3-second countdown ends. No pick loses the throw. Ties don't count. Best of 3.",
  init: () => ({n: 1}),
  mount(root){ this.root = root; this.n = 0; this.pick = null; this.sentN = 0; },
  unmount(){ clearInterval(this.iv); },
  update(g){
    const p = me(), o = opp(p), res = g.res || {};

    if(this.n !== g.n){ this.n = g.n; this.pick = null; this.build(); }
    if(res.p1?.n === g.n && res.p2?.n === g.n) txg((gs, cur) => {
      const a = gs.res?.p1, b = gs.res?.p2; if(a?.n !== gs.n || b?.n !== gs.n) return false;
      let w = null;
      if(a.c === "x" && b.c !== "x") w = "p2"; else if(b.c === "x" && a.c !== "x") w = "p1";
      else if(a.c !== b.c && a.c !== "x") w = BEATS[a.c] === b.c ? "p1" : "p2";
      gs.last = {n: gs.n, p1: a.c, p2: b.c, w}; gs.wins ||= {};
      if(w){ gs.wins[w] = (gs.wins[w] || 0) + 1; if(gs.wins[w] >= 2){ endIn(cur, w, `${nm(w)} won ${gs.wins[w]}–${gs.wins[opp(w)] || 0}`); return; } }
      gs.n++; gs.at = api.now() + 2600; delete gs.res;
    });
  },
  build(){
    cancelAnimationFrame(this.raf);
    const p = me(), o = opp(p), g = this.g, wins = g.wins || {}, last = g.last;
    this.root.innerHTML = "";
    const w = el(`<div><div class="hud"><span>Throw ${g.n}</span><span>You ${wins[p] || 0} – ${wins[o] || 0} ${esc(nm(o))}</span></div>
      <div class="card center">${last ? `<p style="font-size:44px;margin:0">${last[p] === "x" ? "😶" : RPS[last[p]]} vs ${last[o] === "x" ? "😶" : RPS[last[o]]}</p><p><b>${last.w ? (last.w === p ? "You took that one." : esc(nm(o)) + " took that one.") : "Tie. Doesn't count."}</b></p>` : `<p><b>Get ready.</b></p>`}</div>
      <div class="big-count" data-c>…</div><div class="rps">${Object.entries(RPS).map(([k, v]) => `<button data-k="${k}" aria-pressed="false" disabled>${v}</button>`).join("")}</div></div>`);
    this.root.append(w);

    let lastShown = null;
    clearInterval(this.iv);
    const loop = () => {
      const gg = this.g; if(!gg.at) return;
      const t = api.now() - localAt(gg.at);
      if(t < 0){ btns.forEach(b => b.disabled = true); cEl.textContent = "…"; return; }
      if(t < 3000){ btns.forEach(b => b.disabled = false); const s = String(3 - Math.floor(t / 1000)); if(s !== lastShown){ lastShown = s; cEl.textContent = s; tick(); } return; }
      btns.forEach(b => b.disabled = true);
      if(this.sentN !== gg.n){ this.sentN = gg.n; cEl.textContent = this.pick ? "Locked" : "Too slow"; tick(1320, .15); api.update(S.code, {[`g/res/${me()}`]: {n: gg.n, c: this.pick || "x"}}); }
    };
    this.iv = setInterval(loop, 50);
  }
};

  if(mounted.key === key) return;
  unmountGame(); mounted.key = key; app.innerHTML = "";
  const w = el(`<div>${scoreboard()}${R.lastDecline ? `<p class="verdict">${esc(nm("p2"))} declined ${esc(GAMES[R.lastDecline].title)}.</p>` : ""}
    ${host ? `<div class="status mine" style="text-align:left">Pick the game</div><div class="picks"></div>` : `<div class="card center"><p><b>${esc(nm("p1"))} is picking the game.</b></p></div>`}</div>`);
  if(host){ const picks = w.querySelector(".picks");
    GAME_IDS.forEach(id => { const blocked = !c.repick && declined.includes(id);
      const b = el(`<button class="pick">${esc(GAMES[id].title)}<small>${blocked ? "Declined" : esc(GAMES[id].short)}</small></button>`); b.disabled = blocked;
      b.onclick = () => api.tx(S.code, cur => { if(cur.phase !== "propose") return false; cur.proposal = id; cur.phase = "approve"; });
      picks.append(b); }); }
  app.append(w);
}
function approve(){
  const p = me(), host = p === "p1", id = R.proposal, key = "appr" + R.created + id;
  if(mounted.key === key) return;
  unmountGame(); mounted.key = key; app.innerHTML = "";
  const w = el(`<div>${scoreboard()}<div class="status">${host ? "Waiting for approval" : esc(nm("p1")) + " picked"}</div>
    <div class="card"><h2>${esc(GAMES[id].title)}</h2><p>${esc(GAMES[id].blurb)}</p>
    ${host ? `<p class="muted">Waiting for ${esc(nm("p2"))} to approve.</p>` : `<div class="row2"><button class="btn" data-a="yes">Approve</button><button class="btn alt" data-a="no">Decline</button></div>`}</div></div>`);
  if(!host){
    w.querySelector("[data-a=yes]").onclick = () => api.tx(S.code, cur => { if(cur.phase !== "approve" || cur.proposal !== id) return false; delete cur.lastDecline; startGame(cur, id, rnd(2) ? "p1" : "p2"); cur.pickedBy = "p1"; });
    w.querySelector("[data-a=no]").onclick = () => api.tx(S.code, cur => { if(cur.phase !== "approve" || cur.proposal !== id) return false; cur.declined = arr(cur.declined).concat(id); cur.lastDecline = id; cur.phase = "propose"; delete cur.proposal; });
  }
  app.append(w);
}

function result(){
  const r = R.result, p = me(), won = r.winner === p, used = arr(R.used);
  const key = "res" + R.created + r.n + r.winner;
  if(mounted.key === key) return;
  unmountGame(); mounted.key = key;
  app.innerHTML = "";
  const w = el(`<div>${scoreboard()}
    <p class="verdict">${won ? "You won" : esc(nm(r.winner)) + " won"} ${esc(GAMES[r.game].title)}</p>
    <div class="slam ${won ? "" : "lose"}">${esc(msgFor(S.code + R.created + "g" + r.n + r.winner, won ? WIN_MSGS : LOSE_MSGS))}</div>
    <p class="detail">${esc(r.detail)}</p>
    ${won ? `<div class="status mine" style="text-align:left">Pick the next game</div><div class="picks"></div>` : `<div class="card center"><p><b>${esc(nm(r.winner))} is picking the next game.</b></p></div>`}</div>`);
  if(won){
    const picks = w.querySelector(".picks");
    GAME_IDS.forEach(id => {
      const b = el(`<button class="pick">${esc(GAMES[id].title)}<small>${used.includes(id) ? "Already played" : esc(GAMES[id].short)}</small></button>`);
      b.disabled = used.includes(id);
      b.onclick = () => api.tx(S.code, cur => { if(cur.phase !== "result" || arr(cur.used).includes(id)) return false; startGame(cur, id, cur.lastLoser); cur.pickedBy = p; });
      picks.append(b);
    });
  }
  app.append(w);
}

function over(){
  if(R.bot) return botOver();
  const r = R.result, p = me(), won = r.winner === p, rm = R.rematch || {};
  const key = "over" + R.created + r.n + JSON.stringify(rm);
  if(mounted.key === key) return;
  unmountGame(); mounted.key = key;
  app.innerHTML = "";
  const w = el(`<div>${scoreboard()}
    <p class="verdict">${won ? "You won the match" : esc(nm(r.winner)) + " won the match"}</p>
    <div class="slam ${won ? "" : "lose"}">${esc(msgFor(S.code + R.created + "o" + r.n + r.winner, won ? MATCH_WIN_MSGS : MATCH_LOSE_MSGS))}</div>
    <p class="detail">${esc(GAMES[r.game].title)}: ${esc(r.detail)}</p>
    <div class="card center">${rm[p] ? `<p><b>Waiting for ${esc(nm(opp(p)))} to accept the rematch.</b></p>` : `<p>${rm[opp(p)] ? `<b>${esc(nm(opp(p)))} wants a rematch.</b>` : "Again?"}</p><button class="btn">Rematch</button>`}
    <button class="btn ghost" data-a="leave">Leave</button></div></div>`);
  const b = w.querySelector(".btn:not(.ghost)");
  if(b) b.onclick = () => api.tx(S.code, cur => {
    cur.rematch ||= {}; cur.rematch[p] = true;
    if(cur.rematch.p1 && cur.rematch.p2){ delete cur.rematch; cur.score = {p1: 0, p2: 0}; delete cur.used; delete cur.lastLoser; delete cur.declined; delete cur.lastDecline;
      if(cur.bestOf === 1){ cur.phase = "propose"; cur.created = Date.now(); } else startGame(cur, GAME_IDS[rnd(GAME_IDS.length)], rnd(2) ? "p1" : "p2"); }
  });
  w.querySelector("[data-a=leave]").onclick = leave;
  app.append(w);
}

function render(){
  if(!S || !R) return;
  if(!R.players?.[S.pid]){ leave(); return; }
  ({lobby, playing, result, over, propose, approve, botpick})[R.phase]?.();
  if(S?.bot) botDrive();
}

if(S) connect(); else homeScreen();
if(INVITE) history.replaceState(null, "", location.pathname + (LOCAL ? "?local" : ""));
</script>
</body>
</html>
