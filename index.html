<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grudge Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --cobalt:#2B3BD6; --cobalt-deep:#1E2AA8; --paper:#FFF7E6; --ink:#161A4A;
  --sun:#FFC93C; --pink:#FF5C9E; --good:#36C98A; --bad:#E5412F;
  --display:"Bowlby One","Arial Black",Impact,sans-serif;
  --body:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --cobalt:#1C2690; --cobalt-deep:#121a66; } }
:root[data-theme="dark"]{ --cobalt:#1C2690; --cobalt-deep:#121a66; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--cobalt);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#app{max-width:480px;margin:0 auto;padding:14px 14px 28px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.02}
.logo{font-family:var(--display);color:var(--sun);font-size:clamp(46px,15vw,72px);line-height:.9;text-shadow:4px 4px 0 var(--ink);
  transform:rotate(-3deg);margin:18px 0 6px}
.logo span{display:block;color:var(--pink)}
.tag{color:var(--paper);opacity:.85;margin:0 0 18px}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:18px;margin:0 0 16px}
.card h2{font-size:28px;margin-bottom:8px}
.card p{margin:6px 0}
label{display:block;font-weight:800;margin:10px 0 4px}
input{width:100%;font:inherit;font-size:20px;padding:12px 14px;border:3px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
input:focus-visible,button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.btn{display:block;width:100%;font-family:var(--display);font-size:22px;padding:14px 16px;margin:12px 0 0;border:3px solid var(--ink);border-radius:14px;
  background:var(--sun);color:var(--ink);box-shadow:4px 4px 0 var(--ink);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.alt{background:var(--pink)}
.btn.ghost{background:transparent;box-shadow:none;font-family:var(--body);font-weight:800;font-size:17px}
.btn:disabled{opacity:.45;pointer-events:none}
.seg{display:flex;gap:8px}
.seg button{flex:1;font:800 18px var(--body);padding:10px;border:3px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.topbar{display:flex;justify-content:flex-end;position:relative;z-index:5;margin-top:6px}
.gear{width:48px;height:48px;font-size:26px;border:3px solid var(--ink);border-radius:14px;background:var(--paper);box-shadow:3px 3px 0 var(--ink);cursor:pointer;color:var(--ink)}
.cv{display:block;width:100%;border:3px solid var(--ink);border-radius:18px;background:#9ED8F5;touch-action:none}
.hud{display:flex;justify-content:space-between;color:var(--paper);font-weight:800;margin:0 2px 8px}
.shells{position:relative;height:190px;background:linear-gradient(#F4D58D,#E8BF6A);border:3px solid var(--ink);border-radius:18px;overflow:hidden;touch-action:none}
.shell{position:absolute;bottom:34px;width:30%;height:110px;transition:left .25s ease,transform .15s;touch-action:none}
.shell.drag{transition:none;transform:translateY(-14px) scale(1.06);z-index:2}
.shell svg{width:100%;height:100%}
.ball{position:absolute;bottom:22px;width:34px;height:34px;border-radius:50%;background:var(--bad);border:3px solid var(--ink);transition:left .25s ease}
.rps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.rps button{font-size:52px;aspect-ratio:1;border:3px solid var(--ink);border-radius:18px;background:var(--paper);box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.rps button[aria-pressed="true"]{background:var(--sun);transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.bb{position:relative;height:min(76vh,680px);border:3px solid var(--ink);border-radius:18px;overflow:hidden;touch-action:none;background:#05060f}
.bb canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.bb-hud{position:absolute;top:8px;left:8px;right:8px;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;color:#fff;font-weight:800;font-size:13px;pointer-events:none}
.bb-side.r{text-align:right}
.bb-bar{height:12px;border:2px solid #fff;border-radius:7px;overflow:hidden;background:rgba(0,0,0,.4);margin-top:3px}
.bb-bar i{display:block;height:100%;width:0;background:var(--bad);transition:width .15s}
.bb-side.r .bb-bar i{margin-left:auto}
.bb-mid{text-align:center;font-size:11px;opacity:.9}
.bb-time{font-family:var(--display);font-size:28px;line-height:1}
.bb-big{position:absolute;left:0;right:0;top:38%;text-align:center;font-family:var(--display);font-size:clamp(34px,11vw,60px);color:var(--sun);text-shadow:4px 4px 0 var(--ink);pointer-events:none;transition:opacity .2s;padding:0 10px}
.bb-sta{position:absolute;left:120px;right:120px;bottom:22px;color:#fff;font-weight:800;font-size:12px;pointer-events:none}
.bb-sta .bb-bar i{background:var(--good)}
.bb-gl{position:absolute;bottom:12px;width:96px;height:96px;border-radius:50%;border:3px solid rgba(255,255,255,.75);background:rgba(22,26,74,.5);display:flex;align-items:center;justify-content:center;pointer-events:none;transition:transform .08s,background .08s}
.bb-gl.l{left:12px}.bb-gl.r{right:12px}.bb-gl.on{background:rgba(255,201,60,.9);transform:scale(.9)}
.bb-gl svg{width:60px;height:60px}.bb-gl.r svg{transform:scaleX(-1)}
.bb-blkl{position:absolute;left:0;right:0;bottom:62px;text-align:center;color:rgba(255,255,255,.7);font:800 12px var(--body);pointer-events:none}
.bb-rep{position:absolute;top:64px;left:12px;background:var(--bad);color:#fff;font:800 13px var(--body);padding:3px 10px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none}
.bb-nm{width:100%;margin:6px 0 12px}
.err{color:var(--bad);font-weight:800;min-height:1.4em;margin-top:8px}
.banner{background:var(--sun);border:3px solid var(--ink);border-radius:12px;padding:8px 12px;font-size:14px;margin-bottom:14px}
.code{font-family:var(--display);font-size:64px;letter-spacing:.08em;text-align:center;margin:8px 0}
.muted{opacity:.7}
.center{text-align:center}

/* scoreboard */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;color:var(--paper);margin:4px 0 14px}
.score .pl{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score .pl.r{text-align:right}
.score .nums{font-family:var(--display);font-size:30px;display:flex;gap:10px;align-items:center}
.score .nums b{font-weight:400;min-width:1.2ch;text-align:center}
.score .vs{font-family:var(--body);font-weight:800;font-size:13px;opacity:.8}
.c1{color:var(--sun)} .c2{color:var(--pink)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);vertical-align:-1px;margin-right:6px}
.dot.p1{background:var(--sun)} .dot.p2{background:var(--pink)}

.status{font-family:var(--display);font-size:24px;color:var(--paper);text-align:center;margin:6px 0 12px;text-shadow:3px 3px 0 var(--ink)}
.status.mine{color:var(--sun)}

/* grids */
.grid{display:grid;gap:6px;margin:0 auto}
.cell{aspect-ratio:1;border:3px solid var(--ink);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);color:var(--ink);cursor:pointer;padding:0;touch-action:manipulation;position:relative}
.cell:disabled{cursor:default}
.cell.sm{border-width:2px;border-radius:6px}
.mini-wrap{margin-top:16px}
.mini-wrap h3{font-size:16px;color:var(--paper);margin-bottom:6px;font-family:var(--body);font-weight:800}
.mini{max-width:200px;margin:0}
.legend{display:flex;align-items:center;gap:6px;color:var(--paper);font-size:14px;font-weight:800;margin:12px 0 0}
.legend .bar{flex:1;height:14px;border:2px solid var(--ink);border-radius:8px;
  background:linear-gradient(90deg,#FFF3B0,#FFE066,#F9C22E,#F28C28,#E5512A,#C0141E)}

/* ttt */
.ttt{grid-template-columns:repeat(3,1fr);max-width:340px;gap:10px}
.ttt .cell{font-size:64px;border-radius:16px}
.mark-p1{color:var(--ink);background:var(--sun)!important}
.mark-p2{color:var(--ink);background:var(--pink)!important}

/* race */
.lane{position:relative;height:74px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;margin:0 0 12px;overflow:hidden}
.lane .finish{position:absolute;right:0;top:0;bottom:0;width:18px;
  background:repeating-conic-gradient(var(--ink) 0 25%,#fff 0 50%) 0 0/12px 12px;border-left:3px solid var(--ink)}
.lane .cube{position:absolute;top:13px;left:8px;width:42px;height:42px;border:3px solid var(--ink);border-radius:8px;transition:left .08s linear}
.lane .who{position:absolute;left:60px;top:22px;font-weight:800;opacity:.5;font-size:15px}
.pad{height:42vh;min-height:220px;border:3px solid var(--ink);border-radius:22px;background:var(--sun);box-shadow:5px 5px 0 var(--ink);
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:44px;touch-action:none}
.pad.off{background:var(--paper);opacity:.7}
.pad.hit{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--ink)}
.big-count{font-family:var(--display);font-size:120px;color:var(--sun);text-align:center;text-shadow:5px 5px 0 var(--ink);line-height:1}

/* pig */
.die{width:132px;height:132px;margin:8px auto 14px;background:#fff;border:4px solid var(--ink);border-radius:24px;box-shadow:5px 5px 0 var(--ink);
  display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:16px}
.die i{width:24px;height:24px;border-radius:50%;background:var(--ink);place-self:center;visibility:hidden}
.die i.on{visibility:visible}
.die.bust{background:var(--bad)} .die.bust i{background:#fff}
.die.roll{animation:shake .35s}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}50%{transform:rotate(10deg)}75%{transform:rotate(-6deg)}}
.pigrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin:8px 0;font-weight:800}
.meter{height:16px;border:3px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden}
.meter i{display:block;height:100%}
.pot{font-family:var(--display);font-size:26px;text-align:center;margin:4px 0}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}

/* clock */
.clock{font-family:var(--display);font-size:92px;text-align:center;color:var(--paper);text-shadow:5px 5px 0 var(--ink);margin:30px 0 24px;font-variant-numeric:tabular-nums}
.stop{height:200px;border-radius:50%;width:200px;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:40px;background:var(--bad);color:#fff}

/* draw */
.draw-screen{min-height:62vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:22px;border:3px solid var(--ink);padding:20px;background:var(--paper)}
.draw-screen.dark{background:#000;color:#555}
.draw-screen.bang{background:var(--sun)}
.draw-screen.foul{background:var(--bad);color:#fff}
.draw-screen h2{font-size:54px}
.shots{display:flex;gap:8px;justify-content:center;margin:10px 0}

/* hint labels */
.hint{font-family:var(--body);font-weight:800;font-size:11px;position:absolute;bottom:2px;left:0;right:0;text-align:center}
.h-hot{background:#E5512A!important;color:#fff}.h-warm{background:#F9C22E!important}.h-cold{background:#9DB7FF!important}
.picked{background:var(--ink)!important;color:var(--paper)}

/* result */
.slam{font-family:var(--display);font-size:clamp(34px,10vw,48px);color:var(--sun);text-shadow:4px 4px 0 var(--ink);margin:20px 0 8px;line-height:1.05;
  animation:slam .45s cubic-bezier(.2,1.6,.4,1) both}
.slam.lose{color:var(--pink)}
.verdict{color:var(--paper);font-weight:800;font-size:20px;margin:0 0 4px}
.detail{color:var(--paper);opacity:.85;margin:0 0 16px}
@keyframes slam{from{transform:scale(1.8) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{font:800 17px var(--body);text-align:left;padding:12px;border:3px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);
  box-shadow:3px 3px 0 var(--ink);cursor:pointer;min-height:84px}
.pick small{display:block;font-weight:400;font-size:13px;opacity:.75;margin-top:4px}
.pick:disabled{opacity:.35;box-shadow:none;text-decoration:line-through}
.pick:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* party mode */
.pboard{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0 4px}
.pchip{min-width:0;background:var(--paper);border:3px solid var(--ink);border-left:10px solid var(--c);border-radius:12px;padding:3px 8px;display:flex;justify-content:space-between;align-items:center;gap:4px;font-weight:800;font-size:13px}
.pchip b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800}
.pchip span{font-family:var(--display);font-size:20px;line-height:1.1}
.pchip.me{box-shadow:3px 3px 0 var(--ink)}
.pneed{color:var(--paper);opacity:.8;font-size:13px;font-weight:800;text-align:right;margin:0 0 10px}
.pbar{height:10px;background:rgba(255,255,255,.25);border:2px solid var(--ink);border-radius:7px;overflow:hidden;margin:0 0 12px}
.pbar i{display:block;height:100%;width:100%;background:var(--sun)}
.plist{display:grid;gap:6px;margin:12px 0 0}
.prow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:var(--paper);border:3px solid var(--ink);border-left:10px solid var(--c);border-radius:12px;padding:6px 10px;font-size:15px}
.prow b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow span{font-family:var(--display);font-size:20px}
.prow em{font-style:normal;font-weight:800;opacity:.75;min-width:3.5ch;text-align:right}
.prow.win{background:var(--sun)}
.ring{position:relative;width:100%;max-width:400px;aspect-ratio:1;margin:0 auto;border-radius:50%;border:3px dashed rgba(255,247,230,.35)}
.ring.hot{border-color:var(--bad);border-style:solid;animation:hotring .5s ease-in-out infinite alternate}
@keyframes hotring{to{box-shadow:0 0 0 8px rgba(229,65,47,.35)}}
.rn{position:absolute;transform:translate(-50%,-50%);font:800 15px var(--body);padding:8px 10px;min-width:74px;max-width:120px;border:3px solid var(--ink);border-bottom:8px solid var(--c);border-radius:14px;background:var(--paper);color:var(--ink);box-shadow:3px 3px 0 var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;touch-action:manipulation}
.rn small{display:block;font-size:11px;opacity:.7}
.rn:disabled{opacity:1}
.ring.hot .rn:not(:disabled){background:var(--sun)}
.rn.out{opacity:.3!important;text-decoration:line-through}
.bomb{position:absolute;transform:translate(-50%,-50%);font-size:56px;transition:left .22s ease-out,top .22s ease-out;pointer-events:none;filter:drop-shadow(3px 3px 0 var(--ink))}
.bomb.tk{animation:tk .12s ease-out}
@keyframes tk{from{transform:translate(-50%,-50%) scale(1.25)}}
.chairs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:380px;margin:0 auto}
.chair{aspect-ratio:1;border:3px solid var(--ink);border-radius:16px;background:var(--paper);box-shadow:4px 4px 0 var(--ink);font:800 13px var(--body);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:manipulation;padding:4px}
.chair span{font-size:46px;line-height:1}
.chair small{min-height:1.2em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chair.sat{background:var(--c);opacity:1}
.chair:disabled:not(.sat){opacity:.55}
.numgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:400px;margin:0 auto}
.numgrid button{font:400 24px var(--display);aspect-ratio:1;border:3px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink);box-shadow:3px 3px 0 var(--ink);touch-action:manipulation;padding:0}
.numgrid button[aria-pressed=true]{background:var(--sun);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.prize-v{font-family:var(--display);font-size:72px;line-height:1;margin:4px 0}
.bidv{font-family:var(--display);font-size:56px;line-height:1}
.big-pot{font-family:var(--display);font-size:clamp(64px,22vw,110px);color:var(--sun);text-align:center;text-shadow:5px 5px 0 var(--ink);line-height:1;margin:6px 0 10px}
.holdbtn{display:block;width:min(220px,60vw);aspect-ratio:1;margin:12px auto;border-radius:50%;border:4px solid var(--ink);background:var(--pink);color:var(--ink);font:400 34px var(--display);box-shadow:6px 6px 0 var(--ink);touch-action:none;-webkit-touch-callout:none}
.holdbtn.on{background:var(--sun);transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
.holders{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.hchip{background:var(--paper);border:3px solid var(--ink);border-left:8px solid var(--c);border-radius:10px;padding:3px 8px;font-weight:800;font-size:13px}
.hchip.off{opacity:.45}
.chat{display:grid;gap:6px;margin:10px 0}
.bubble{background:var(--paper);border:3px solid var(--ink);border-left:8px solid var(--c);border-radius:12px;padding:6px 10px;justify-self:start;max-width:85%}
.bubble.me{justify-self:end}
.msgbtns{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.msgbtns button{font:800 14px var(--body);padding:7px 10px;border:3px solid var(--ink);border-radius:20px;background:#fff;color:var(--ink);touch-action:manipulation}
.lc-cv{display:block;margin:0 auto;border:3px solid var(--ink);border-radius:12px;touch-action:none}
.lc-ctl{display:flex;gap:10px;justify-content:center;margin:12px 0 0}
.hold{flex:1;max-width:160px;font:400 22px var(--display);padding:16px 8px;border:3px solid var(--ink);border-radius:16px;background:var(--paper);color:var(--ink);box-shadow:4px 4px 0 var(--ink);touch-action:none;position:relative;overflow:hidden;-webkit-touch-callout:none}
.hold.on{background:var(--sun);transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.hold.boost i{position:absolute;left:0;bottom:0;height:6px;width:100%;background:var(--good)}
.tr-cv{display:block;width:100%;border:3px solid var(--ink);border-radius:14px;touch-action:none}
.kh{position:relative;height:min(76vh,640px);border:3px solid var(--ink);border-radius:18px;overflow:hidden;touch-action:none;background:#2B3BD6}
.kh canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.kh-top{position:absolute;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;color:#fff;font:800 13px var(--body);text-shadow:1px 1px 0 var(--ink);pointer-events:none}
.joy{position:absolute;left:14px;bottom:14px;width:124px;height:124px;border-radius:50%;background:rgba(22,26,74,.35);border:3px solid rgba(255,255,255,.7);touch-action:none}
.joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--sun);border:3px solid var(--ink);pointer-events:none}
.shovebtn{position:absolute;right:14px;bottom:18px;width:112px;height:112px;border-radius:50%;border:3px solid var(--ink);background:var(--pink);color:var(--ink);font:400 20px var(--display);box-shadow:4px 4px 0 var(--ink);touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center}
.shovebtn small{font:800 10px var(--body);opacity:.8;margin-top:2px}
.shovebtn.on{background:var(--sun);transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.tilt-ok{font-weight:800;margin:8px 0 0;min-height:1.3em}

/* the result slam starts at 1.8x; never let it widen the page (Android zooms out and taps land off) */
#app{overflow-x:hidden;overflow-x:clip}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== FIREBASE CONFIG (same project as Deep Salvo and Sovereign) ===== */
const FIREBASE_CONFIG = {

/* ---- Tap Race ---- */
const RACE_TARGET = 60;
GAMES.race = {
  title: "Tap Race", short: "Tap fastest to the line",
  blurb: "Tap as fast as you can. Every tap pushes your cube toward the finish line. Any fingers, any taps.",
  init: () => ({}),
  mount(root){ this.root = root; this.n = 0; this.live = false; this.sent = 0; this.done = false; this.built = false; this.cd = null; },
  unmount(){ clearInterval(this.flush); clearInterval(this.cd); },
  update(g){
    const p = me();
    if(!g.at){ txg(gs => { if(gs.at) return false; gs.at = api.now() + 3000; }); }
    if(!this.built) this.build();
    if(g.at && !this.cd && !this.live){
      this.cd = setInterval(() => {
        const left = localAt(g.at) - api.now();
        if(left <= 0){ clearInterval(this.cd); this.live = true; this.big.textContent = "GO"; tick(1320, .15); this.pad.classList.remove("off"); this.pad.textContent = "TAP"; return; }
        const s = Math.ceil(left / 1000); if(this.big.textContent !== String(s)){ this.big.textContent = s; tick(); }
      }, 50);
    }
    const ot = g.taps?.[opp(p)] || 0;
    this.setCube(opp(p), ot);
    if(g.fin && Object.keys(g.fin).length && !this.finQ){ this.finQ = true; setTimeout(() => raceFinalize(), 750); }
  },
  setCube(who, n){ const lane = this.lanes[who]; const w = lane.clientWidth - 70; lane.querySelector(".cube").style.left = (8 + Math.min(1, n / RACE_TARGET) * w + (n >= RACE_TARGET ? 12 : 0)) + "px"; },
  build(){
    this.built = true; const p = me();
    const wrap = el(`<div><div class="big-count">3</div>
      ${["p1","p2"].map(x => `<div class="lane" data-l="${x}"><div class="finish"></div><div class="who">${esc(nm(x))}${x === p ? " (you)" : ""}</div><div class="cube" style="background:var(${x === "p1" ? "--sun" : "--pink"})"></div></div>`).join("")}
      <div class="pad off">Wait…</div></div>`);
    this.root.innerHTML = ""; this.root.append(wrap);
    this.big = wrap.querySelector(".big-count"); this.pad = wrap.querySelector(".pad");
    this.lanes = {p1: wrap.querySelector("[data-l=p1]"), p2: wrap.querySelector("[data-l=p2]")};
    this.pad.addEventListener("pointerdown", e => {
      e.preventDefault(); if(!this.live || this.done) return;
      this.n++; this.setCube(p, this.n); this.pad.classList.add("hit"); setTimeout(() => this.pad.classList.remove("hit"), 50);
      if(this.n >= RACE_TARGET){ this.done = true; this.push(); api.update(S.code, {[`g/fin/${p}`]: api.now()}); this.finQ = true; setTimeout(() => raceFinalize(), 750); }
    });
    this.flush = setInterval(() => this.push(), 350);
  },
  push(){ if(this.n !== this.sent){ this.sent = this.n; api.update(S.code, {[`g/taps/${me()}`]: this.n}); } }
};

function raceFinalize(tries = 0){
  return txg((gs, cur) => {
    const f = gs.fin || {}, ks = Object.keys(f); if(!ks.length) return false;
    const w = ks.length > 1 ? (f.p1 <= f.p2 ? "p1" : "p2") : ks[0];
    endIn(cur, w, `${nm(w)} crossed the line first`);
  }).then(ok => { if(!ok && R?.phase === "playing" && R.current === "race" && tries < 6) setTimeout(() => raceFinalize(tries + 1), 400); });
}

const FLASH_N = 5;
const flashPattern = (level) => { const k = Math.min(12, level + 2), s = new Set(); while(s.size < k) s.add(rnd(FLASH_N * FLASH_N)); return [...s]; };
GAMES.flash = {

  init: () => ({level: 1, seq: 1, pat: flashPattern(1)}),
  mount(root){ this.root = root; this.seq = 0; this.timers = []; },
  unmount(){ this.timers.forEach(clearTimeout); },
  update(g){
    const p = me(), res = g.res || {};
    if(this.seq !== g.seq){ this.seq = g.seq; this.timers.forEach(clearTimeout); this.timers = []; this.run(g); }
    if(res.p1?.seq === g.seq && res.p2?.seq === g.seq){
      txg((gs, cur) => {
        const r = gs.res || {}; if(r.p1?.seq !== gs.seq || r.p2?.seq !== gs.seq) return false;
        if(r.p1.ok !== r.p2.ok){ const w = r.p1.ok ? "p1" : "p2"; endIn(cur, w, `${nm(w)} survived round ${gs.level}`); return; }
        if(r.p1.ok) gs.level++;
        gs.seq++; gs.pat = flashPattern(gs.level); delete gs.res;
      });
    }
  },
  run(g){
    const pat = arr(g.pat), seq = g.seq, level = g.level;
    const wrap = el(`<div><div class="status">Round ${level}</div><div class="grid" style="grid-template-columns:repeat(${FLASH_N},1fr);max-width:400px"></div><p class="center" style="color:var(--paper)" data-m>Get ready…</p></div>`);
    const grid = wrap.querySelector(".grid"), msg = wrap.querySelector("[data-m]"), cells = [];
    for(let i = 0; i < FLASH_N * FLASH_N; i++){ const b = el(`<button class="cell" disabled></button>`); cells.push(b); grid.append(b); }

    const found = new Set(); let over = false;

    this.timers.push(setTimeout(() => {
      msg.textContent = "Memorize"; pat.forEach(i => cells[i].style.background = "var(--sun)"); tick(990);
      this.timers.push(setTimeout(() => {
        pat.forEach(i => cells[i].style.background = ""); msg.textContent = `Tap all ${pat.length}`;

        }; });

    }, 1200));
  }
};

      txg((gs, cur) => {

        const d1 = Math.abs(r.p1.t - 5000), d2 = Math.abs(r.p2.t - 5000);

function boardEl(n, cellFn, cls = "", max = 420){
  const g = el(`<div class="grid ${cls}" style="grid-template-columns:repeat(${n},1fr);max-width:${max}px;gap:${n > 6 ? 4 : 6}px"></div>`);
  for(let i = 0; i < n * n; i++) g.append(cellFn(i));
  return g;
}
const CHEST_SVG = `<svg viewBox="0 0 24 24" width="70%" height="70%" aria-label="Treasure chest"><path d="M3 10a5 5 0 0 1 5-5h8a5 5 0 0 1 5 5v1H3z" fill="#8B4A1C" stroke="#161A4A" stroke-width="1.5"/><rect x="3" y="11" width="18" height="9" rx="1.5" fill="#A85A24" stroke="#161A4A" stroke-width="1.5"/><rect x="10" y="9" width="4" height="5" rx="1" fill="#FFC93C" stroke="#161A4A" stroke-width="1.2"/><path d="M3 11h18" stroke="#FFC93C" stroke-width="1.5"/></svg>`;

function hidePhase(root, n, title, prompt, g, iconHtml){
  const p = me(), spot = g.spot || {};
  if(spot[p] == null){
    root.innerHTML = "";
    const wrap = el(`<div><div class="status mine">${title}</div><p class="center" style="color:var(--paper)">${prompt}</p></div>`);
    wrap.append(boardEl(n, i => { const b = el(`<button class="cell ${n > 6 ? "sm" : ""}" aria-label="Square ${i + 1}"></button>`); b.onclick = () => { tick(); api.update(S.code, {[`g/spot/${p}`]: i}); }; return b; }));
    root.append(wrap); return true;
  }
  if(spot[opp(p)] == null){
    root.innerHTML = "";
    const wrap = el(`<div><div class="status">Hidden</div><p class="center" style="color:var(--paper)">Waiting for ${esc(nm(opp(p)))} to hide.</p></div>`);
    wrap.append(boardEl(n, i => el(`<button class="cell ${n > 6 ? "sm" : ""}" disabled>${i === spot[p] ? iconHtml : ""}</button>`)));
    root.append(wrap); return true;
  }
  return false;
}

    wrap.append(boardEl(HS_N, i => {

/* ---------------- shared realtime engine ---------------- */
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function realtime(def){
  return Object.assign({
    mount(root){ this.root = root; this.round = null; this.raf = 0; },
    unmount(){ cancelAnimationFrame(this.raf); window.removeEventListener("resize", this.onResize || (() => {})); },
    update(g){
      const o = opp(me()), round = g.round || 1;
      this.g = g;
      if(this.round !== round){ this.round = round; this.start(g); }
      if(!g.at) txg(gs => { if(gs.at) return false; gs.at = api.now() + 3000; });
      const res = g.res || {};
      if(this.survival && res[o] && !this.sent && this.started) this.finish(Math.max(this.t, res[o].t + 0.001));
      if(res.p1 && res.p2) txg((gs, cur) => {
        const a = gs.res?.p1, b = gs.res?.p2; if(!a || !b) return false;
        const k = this.survival ? "t" : "s";
        if(a[k] === b[k]){ gs.round = (gs.round || 1) + 1; gs.seed = rnd(1e9); delete gs.res; delete gs.at; delete gs.hits; return; }
        const w = a[k] > b[k] ? "p1" : "p2"; endIn(cur, w, this.detail(a, b));
      });
    },
    start(g){
      cancelAnimationFrame(this.raf);
      this.sent = false; this.started = false; this.t = 0; this.lastHits = 0; this.lastCount = null;
      this.root.innerHTML = "";
      const wrap = el(`<div>${(g.round || 1) > 1 ? `<div class="status">Dead even. Again.</div>` : ""}<div class="hud"><span data-h1></span><span data-h2></span></div><canvas class="cv"></canvas></div>`);
      this.root.append(wrap);
      this.h1 = wrap.querySelector("[data-h1]"); this.h2 = wrap.querySelector("[data-h2]");

        for(let i = 2; i <= 6; i++) if(!seats["p" + i]){ seat = "p" + i; cur.seats = seats; cur.seats[seat] = {name: n}; return; }

function pAvail(id){ const G = PG[id]; return !(G.minHumans && pHumans().length < G.minHumans); }

/* ---------- referee (host only) ---------- */
function partyRefStart(){ if(PREF.iv) return; PREF.iv = setInterval(partyTick, 100); }
function partyRefStop(){ clearInterval(PREF.iv); PREF.iv = null; PREF.timers.forEach(clearTimeout); PREF.timers = []; PREF.memo = {}; PREF.B = {}; }
function pCtx(g){
  const gn = R.gn;
  return {
    now: nowS(), g, lvl: pLvl(), diff: R.diff, seats: arr(g.seats || pSeats()),
    memo(k){ const key = gn + ":" + k; if(PREF.memo[key]) return false; PREF.memo[key] = 1; return true; },
    set(patch){ const p = {}; for(const k in patch) p["g/" + k] = patch[k] === undefined ? null : patch[k]; return api.update(S.code, p).catch(() => {}); },
    replace(ng){ ng.seats = ng.seats || g.seats; return api.update(S.code, {g: ng}).catch(() => {}); },
    later(ms, f){ const id = setTimeout(() => { if(R?.party && R.gn === gn && R.phase === "play") f(); }, ms); PREF.timers.push(id); },
    win(seat, detail){ if(!this.memo("WIN")) return; pWin(seat, detail); }
  };
}
function pWin(seat, detail){
  const gn = R.gn;
  api.tx(S.code, cur => {
    if(cur.phase !== "play" || cur.gn !== gn) return false;
    cur.score ||= {}; cur.score[seat] = (cur.score[seat] || 0) + 1;
    cur.result = {winner: seat, game: cur.current, detail: detail || "", n: gn};
    cur.last = cur.current;
    cur.phase = cur.score[seat] >= Math.ceil(cur.bestOf / 2) ? "over" : "result";
    cur.rp = (cur.phase === "result" && cur.seats?.[seat]?.bot) ? Date.now() : null;
  }).catch(() => {});
}
function pStartGame(cur, id){

}
function partyTick(){
  if(!S?.party || !R?.party || !pHost()){ partyRefStop(); return; }
  if(PREF.gn !== R.gn){ PREF.B = {}; PREF.gn = R.gn; }
  const ph = R.phase;
  if(ph === "intro"){
    const humans = pHumans(), r = R.rdy || {};
    if(humans.every(s => r[s]) && PREF.memo["init" + R.gn] !== 1){
      PREF.memo["init" + R.gn] = 1;
      const id = R.current, seats = (PG[id].humansOnly ? humans : pSeats());
      const c = pCtx({seats}); c.seats = seats;
      const g = PG[id].init(c); g.seats = seats; g.in = {};
      api.tx(S.code, cur => { if(cur.phase !== "intro" || cur.gn !== R.gn) return false; cur.g = g; cur.phase = "play"; }).catch(() => { delete PREF.memo["init" + R.gn]; });
    }
    return;
  }
  if(ph === "result" && R.rp && pBot(R.result?.winner)){
    if(Date.now() - R.rp > 1800 && PREF.memo["bp" + R.gn] !== 1){ PREF.memo["bp" + R.gn] = 1;
      const ids = PG_IDS().filter(id => id !== R.last && pAvail(id));
      const id = pick1(ids); api.tx(S.code, cur => { if(cur.phase !== "result") return false; pStartGame(cur, id); }).catch(() => {}); }
    return;
  }
  if(ph !== "play" || !R.g) return;
  const G = PG[R.current], g = R.g, c = pCtx(g);
  try{ G.ref?.(g, c); }catch(e){ console.error("ref", e); }
  if(G.bot){ for(const s of arr(g.seats)) if(pBot(s)){ const B = PREF.B[s] ||= {}; try{ G.bot(g, s, B, c); }catch(e){ console.error("bot", e); } } }
}

function chipMusic(){
  const ac = audio(), master = ac.createGain(); master.gain.value = .9; master.connect(ac.destination);
  const mel = [76, 79, 84, 79, 77, 81, 84, 81, 76, 79, 83, 79, 74, 77, 79, 77, 72, 76, 79, 76, 74, 77, 81, 77, 76, 79, 84, 86, 84, 79, 76, 74];
  const bas = [48, 48, 55, 55, 53, 53, 57, 57, 52, 52, 55, 55, 50, 50, 55, 55];
  const step = 60 / 152 / 2; let next = 0, i = 0, from = 0, until = 0, fakes = [], timer = null;
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const note = (type, m, t, d, v) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = hz(m); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(master); o.start(t); o.stop(t + d + .02); };
  const sched = () => {
    while(next < ac.currentTime + .25 && next < until){
      if(next >= from){ const fk = fakes.some(([a, b]) => next >= a && next < b), dn = fk ? -12 : 0, v = fk ? .3 : 1;
        note("square", mel[i % mel.length] + dn, next, step * .85, .05 * v);
        if(i % 2 === 0) note("triangle", bas[(i / 2) % bas.length] + dn, next, step * 1.8, .14 * v);
        if(i % 4 === 2) { const n = ac.createBufferSource(), g = ac.createGain(), hp = ac.createBiquadFilter(); n.buffer = noiseBuf(.05); hp.type = "highpass"; hp.frequency.value = 6000; g.gain.setValueAtTime(.08 * v, next); g.gain.exponentialRampToValueAtTime(.001, next + .05); n.connect(hp).connect(g).connect(master); n.start(next); } }
      next += step; i++;
    }
  };
  return {
    play(startMs, stopMs, fakeMs){ const toAc = ms => ac.currentTime + (ms - nowS()) / 1000; from = toAc(startMs); until = toAc(stopMs); next = Math.max(from, ac.currentTime); i = 0;
      fakes = arr(fakeMs).map(f => [toAc(f), toAc(f) + .7]); clearInterval(timer); timer = setInterval(sched, 40); sched(); },
    scratch(){ try{ const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(); o.type = "sawtooth"; o.frequency.setValueAtTime(600, t); o.frequency.exponentialRampToValueAtTime(60, t + .35); g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + .4); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + .45); }catch{} },
    kill(){ clearInterval(timer); until = 0; try{ master.gain.setValueAtTime(0, ac.currentTime); master.disconnect(); }catch{} }
  };
}
PG.chairs = {
  title: "Musical Chairs", short: "Grab a chair when it stops",
  blurb: "Music plays. When it stops, tap an empty chair. There's one fewer chair than players, so whoever's left standing is out. Tap a chair while the music's still playing and you're out too. Last one sitting wins.",
  round(c, alive, round, out){
    const start = c.now + 3000, stop = start + 5000 + Math.random() * 10000;
    const fakes = c.diff === "hard" && pSeats().some(pBot) ? [...Array(1 + rnd(2))].map(() => start + 1500 + Math.random() * (stop - start - 3200)).filter(t => t > start + 1000 && t < stop - 1500).sort((a, b) => a - b) : [];
    return {alive, out, round, start, stop, fakes, chairs: alive.length - 1, taken: {}, early: [], ph: "music", in: {}};
  },
  init(c){ return this.round(c, c.seats.slice(), 1, []); },
  ref(g, c){
    const alive = arr(g.alive), inp = g.in || {};
    if(g.ph === "music" || g.ph === "grab"){
      let early = arr(g.early).slice(), taken = {...(g.taken || {})}, ch = false;
      for(const s of alive){ const t = inp[s]?.sit; if(t && t.r === g.round && t.t < g.stop && !early.includes(s)){ early.push(s); ch = true; } }
      if(g.ph === "music" && c.now >= g.stop){ c.set({ph: "grab", early}); return; }
      if(g.ph === "grab"){
        const seated = new Set(Object.values(taken));
        const reqs = alive.filter(s => !early.includes(s) && !seated.has(s)).map(s => [s, inp[s]?.sit]).filter(([, t]) => t && t.r === g.round && t.t >= g.stop).sort((a, b) => a[1].t - b[1].t);
        for(const [s, t] of reqs){ if(t.c >= 0 && t.c < g.chairs && !taken[t.c] && !seated.has(s)){ taken[t.c] = s; seated.add(s); ch = true; } }
        const contenders = alive.filter(s => !early.includes(s));
        const full = Object.keys(taken).length >= g.chairs || contenders.every(s => seated.has(s));
        if((full && c.now >= g.stop + 400) || c.now >= g.stop + 6000){
          if(!c.memo("end" + g.round)) return;
          const gone = alive.filter(s => early.includes(s) || !seated.has(s)), left = alive.filter(s => !gone.includes(s));
          c.set({ph: "done", taken, early, gone, next: c.now + 3000});
          if(left.length === 1) c.later(2600, () => c.win(left[0], `${pName(left[0])} got the last chair`));
          return;
        }
      }
      if(ch) c.set({early, taken});
    } else if(g.ph === "done" && c.now >= g.next && c.memo("nx" + g.round)){
      const gone = arr(g.gone), left = alive.filter(s => !gone.includes(s));
      if(left.length === 1) return;
      const nx = left.length === 0 ? this.round(c, alive, g.round + 1, arr(g.out)) : this.round(c, left, g.round + 1, arr(g.out).concat(gone));
      if(left.length === 0) nx.replay = 1;
      c.replace(Object.assign(nx, {seats: g.seats}));
    }
  },
  bot(g, s, B, c){
    if(g.ph !== "grab" || !arr(g.alive).includes(s) || arr(g.early).includes(s)) return;
    if(Object.values(g.taken || {}).includes(s)) return;
    if(B.r !== g.round){ B.r = g.round; B.at = g.stop + Math.max(150, [900, 600, 380][c.lvl] + gauss() * [300, 150, 80][c.lvl]); B.k = 0; }
    if(c.now < B.at || B.wait > c.now) return;
    const free = [...Array(g.chairs).keys()].filter(i => !(g.taken || {})[i]); if(!free.length) return;
    B.k++; B.wait = c.now + 300; pin("sit", {r: g.round, c: pick1(free), t: nowS(), k: B.k}, s);
  },
  view(){ return {
    mount(root){ this.root = root; this.k = 0;
      root.append(el(`<div><div class="status" data-st></div><div class="chairs" data-ch></div><p class="center detail" data-sub></p></div>`));
      this.st = root.querySelector("[data-st]"); this.ch = root.querySelector("[data-ch]"); this.sub = root.querySelector("[data-sub]");
      pRaf(this, () => this.frame()); },
    unmount(){ this.dead = true; cancelAnimationFrame(this.raf); this.mus?.kill(); },
    update(g){
      this.g = g;
      if(this.round !== g.round){ this.round = g.round; this.myTap = null; this.mus?.kill(); this.mus = chipMusic(); this.mus.play(g.start, g.stop, g.fakes); this.stopped = false; }
      const key = JSON.stringify([g.ph, g.taken, g.early, g.gone, g.round, this.myTap]); if(key === this.key) return; this.key = key;
      this.paint();
    },
    paint(){
      const g = this.g, me = S.pid, alive = arr(g.alive), taken = g.taken || {}, early = arr(g.early), mineSeat = Object.keys(taken).find(k => taken[k] === me);
      const inGame = alive.includes(me), iEarly = early.includes(me) || this.myTap === "early";
      this.ch.innerHTML = "";
      for(let i = 0; i < g.chairs; i++){
        const who = taken[i];
        const b = el(`<button class="chair${who ? " sat" : ""}" style="${who ? `--c:${pCol(who)}` : ""}"><span>🪑</span><small>${who ? esc(pName(who)) : ""}</small></button>`);
        b.disabled = !!who || !inGame || iEarly || !!mineSeat || g.ph === "done";
        b.onclick = () => {
          if(this.myTap === "early") return;
          const now = nowS();
          if(now < g.stop){ this.myTap = "early"; tick(200, .3); pin("sit", {r: g.round, c: i, t: now, k: ++this.k}); this.paint(); return; }
          tick(900, .05); pin("sit", {r: g.round, c: i, t: now, k: ++this.k});
        };
        this.ch.append(b);
      }
      let st = "", sub = "";
      if(!inGame){ st = "You're out. Watching."; }
      else if(iEarly){ st = "Too early. You're out."; }
      else if(g.ph === "music"){ st = "♪ Music's playing ♪"; sub = "Don't touch a chair yet."; }
      else if(g.ph === "grab"){ st = mineSeat != null ? "You got a chair." : "GRAB A CHAIR!"; }
      if(g.ph === "done"){ const gone = arr(g.gone); st = gone.includes(me) ? (early.includes(me) ? "Too early. You're out." : "No chair. You're out.") : gone.length ? `${gone.map(pName).join(" and ")} ${gone.length > 1 ? "are" : "is"} out` : "Everyone sat."; sub = arr(g.alive).length - gone.length === 0 ? "Everyone went out at once. Replaying the round." : ""; }
      if(g.replay && g.ph === "music") sub = "Replay round. " + sub;
      this.st.textContent = st; this.st.classList.toggle("mine", g.ph === "grab" && inGame && !iEarly && mineSeat == null); this.sub.textContent = sub;
    },
    frame(){
      const g = this.g; if(!g) return; const now = nowS();
      if(g.ph === "music" && now < g.start){ const s = pCount(g.start); if(this.cd !== s){ this.cd = s; this.sub.textContent = `Music in ${s}…`; } }
      if(!this.stopped && now >= g.stop && g.round === this.round){ this.stopped = true; this.mus?.scratch(); if(g.ph === "music"){ this.st.textContent = arr(g.alive).includes(S.pid) && this.myTap !== "early" ? "GRAB A CHAIR!" : this.st.textContent; } }
    }
  }; }
};

/* ---- Lowest Unique ---- */
PG.lowest = {
  title: "Lowest Unique", short: "Lowest number nobody else picked",
  blurb: "Everyone secretly picks a number from 1 to 20. The lowest number nobody else picked scores a point. If every number got doubled up, the least-picked number scores for everyone who picked it. 5 seconds to pick. First to 3 points.",
  init(c){ const start = c.now + 2500; return {pts: Object.fromEntries(c.seats.map(s => [s, 0])), play: c.seats.slice(), round: 1, ph: "pick", start, end: start + 5000, sd: 0}; },
  ref(g, c){

      c.replace({pts: g.pts, play: sd || g.play, round: g.round + 1, ph: "pick", start, end: start + 5000, sd: sd ? 1 : g.sd, hist: arr(g.hist).concat([g.picks || {}]).slice(-3), seats: g.seats, in: {}});

  bot(g, s, B, c){

      const cands = [...Array(10).keys()].map(i => i + 1).map(x => [x, (freq[x] || 0) * 2 + x * .35 + Math.random() * 1.6]).sort((a, b) => a[1] - b[1]); n = cands[0][0]; }
    c.later(500 + Math.random() * 3200, () => pin("pk", {r: g.round, n}, s));
  },
  view(){ return {
    mount(root){ this.root = root;
      root.append(el(`<div><div class="status" data-st></div>${pBarHtml()}<div class="numgrid" data-g></div><div data-rv></div><p class="center detail" data-sub></p></div>`));
      this.st = root.querySelector("[data-st]"); this.grid = root.querySelector("[data-g]"); this.rv = root.querySelector("[data-rv]"); this.sub = root.querySelector("[data-sub]");

    unmount(){ this.dead = true; cancelAnimationFrame(this.raf); },

  bot(g, s, B, c){

/* ---- shared: side docs + survival rounds ---- */
const SIDE = {data: {}, subs: {}, gn: null};
function sideWatch(kind, seats){
  if(SIDE.gn !== R.gn + kind){ sideClear(); SIDE.gn = R.gn + kind; }
  arr(seats).forEach(s => { const id = `${S.code}_${kind}_${s}`; if(SIDE.subs[id]) return; SIDE.subs[id] = api.listen(id, v => { SIDE.data[s] = v || null; }); });
}
function sideClear(){ Object.values(SIDE.subs).forEach(f => { try{ f(); }catch{} }); SIDE.subs = {}; SIDE.data = {}; SIDE.gn = null; }
const sidePut = (kind, seat, v) => api.update(`${S.code}_${kind}_${seat}`, v).catch(() => {});
function survivalRef(g, c, mk, verb){
  if(g.ph === "run"){
    if(c.now < g.at) return;
    const play = arr(g.play), deaths = {};
    play.forEach(s => { const d = g.in?.[s]?.dead; if(d && d.r === g.round) deaths[s] = d.t; else if(!R.seats?.[s]) deaths[s] = 0; });

  title: "Imposter", short: "One player is faking it", minHumans: 3, humansOnly: true,
  blurb: "Everyone gets the same secret word except one player: the imposter. Each player types a one-word clue, two rounds around the table, then everyone votes on who's faking. Correct voters get 1 point. An imposter who isn't caught gets 2. A caught imposter can still steal 1 by guessing the word. First to 5.",
  newRound(c, seats, round, pts, cv, lastImp){

  init(c){ const z = Object.fromEntries(c.seats.map(s => [s, 0])); return this.newRound(c, c.seats.slice(), 1, z, {...z}, null); },
  validClue(w, word){ const n = impNorm(w); return n.length >= 1 && n.length <= 20 && !/\s/.test(String(w).trim()) && isCleanText(n) && n !== impNorm(word); },
  ref(g, c){

      if(c.now < g.start) return;

      if(!(Object.keys(votes).length === n || c.now >= g.end + 300) || !c.memo("vote" + g.round)) return;

  view(){ return {

        if(T0.kind === "still"){ c.strokeStyle = "rgba(22,26,74,.35)"; c.lineWidth = 3; c.beginPath(); c.arc(x, y, r + 6, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - el / T0.life)); c.stroke(); }
      }
      const pn = performance.now(); this.pops = this.pops.filter(p => pn - p.t < 700);
      for(const p of this.pops){ const a = 1 - (pn - p.t) / 700; c.globalAlpha = a; c.fillStyle = p.c === "#fff" ? "#161A4A" : p.c; c.font = `800 18px "Bricolage Grotesque", sans-serif`; c.textAlign = "center"; c.fillText(p.txt, p.x * W, p.y * H - 20 - (1 - a) * 24); c.globalAlpha = 1; }
    }
  }; }
};
